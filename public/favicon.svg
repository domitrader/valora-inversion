<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>
  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="128" fill="url(#grad)" />
  
  <!-- Subtle glowing circle -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="8" />

  <!-- Logo symbol: Elegant 'V' with dynamic financial chart arrow -->
  <path d="M140 180 L230 350 L270 280 L320 340 L380 180" 
        fill="none" 
        stroke="url(#accent)" 
        stroke-width="36" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
  <circle cx="380" cy="180" r="22" fill="#10B981" />
</svg>
